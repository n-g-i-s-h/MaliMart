<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>

    <link rel="stylesheet" href="css/signup.css" />

        <!-- Font Awesome CDN link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  </head>

  <body>

    <div class="container">

      <div class="leftcontent">

        <h3>Come join us!</h3>

        <p>We are so excited to have you here. If you haven't already, create an account to get access to exclusive offers, rewards, and discounts.</p>
      
        <button id="signin">Already have an account?Signin.</button>



      </div>


      <div class="rightcontent">

        <form action="">
          <legend>Signup</legend>
          <input type="text" id="fullname" placeholder="ByteWebster" required>
          <br><br>
        
          <input type="email" id="email" placeholder="support@bytewebster.com" required>
          <br><br>
        
          <input type="password" id="password" placeholder="enter password" required>
          <br><br>
        
          <input type="password" id="repeat password" placeholder="repeat password"  required>
          <br><br>

                  
          <button id="signup">Signup</button>
          <br>
          
          <p id="paragraph">or signup with</p>

          

          <div class="icons">
            <a href=""><i class="fa-brands fa-facebook"></i></a>
            <a href=""><i class="fa-brands fa-google-plus-g"></i></a>
            <a href=""><i class="fa-brands fa-linkedin"></i></a>
          </div>
        
          </br>
        </form>

      </div>

    </div>

  </body>
</html>
