<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page - MaliMart</title>


    <link rel="stylesheet" href="css/register.css">



</head>
<body>
    
    <form action="">

        <legend>Join Us Today!</legend>

        <br><br>

        <label for="fullname"> Full Name:</label>
        <input type="text" id="fullname" placeholder="eg John Doe" required>

        <br><br>

        <label for="emailaddress">Email Address</label>
        <input type="email" id="emailaddress" placeholder="e.g abc@gmail.com" required>

        <br><br>

        <label for="createpassword">Create Password</label>
        <input type="password" id="createpassword" placeholder="Enter Password" required>

        <br><br>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="0701234578" required>

        <br><br>

        <label for="dob">Birthday</label>
        <input type="date" id="dob" required>

        <br><br>

        <label for="dt">Date and Time</label>
        <input type="datetime-local" id="dt" required>

        <br><br>

        <label for="upload">Upload File</label>
        <input type="file" id="upload" required>

        <br><br>
        <!-- Textarea -->
        <!-- Dropdown
        Checkbox
        Radiobutton -->

        <button>Register</button>





    </form>



    
</body>
</html>
