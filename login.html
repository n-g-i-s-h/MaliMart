<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <script src="bootstrap/js/bootstrap.min.js"></script>





    

<body>

    <div class="d-flex justify-content-center align-items-center bg-dark-subtle" style="height: 100vh;">

        <form class="bg-white border border-secondary-subtle border-2 rounded-3" style="width: 100%; max-width: 650px;">

            <legend class="fs-5 fw-bold text-secondary mb-3 text-center">Log in</legend>

            <div data-mdb-input-init class="form-outline mb-4">
                <input type="email" class="form-control" placeholder="Email Address">
            </div>

            <div data-mdb-input-init class="form-outline mb-4">
                <input type="password" class="form-control" placeholder="Password">
            </div>

            <div class="row mb-4">

                <div class="col d-flex justify-content-center">

                    <input class="form-check-input" id="formcheck" type="checkbox" checked>
                    <label class="form-check-label" for="formcheck">Remember Me</label>

                </div>

                <div class="col">

                    <a href="#!">Forgot Password</a>

                </div>

            </div>
            <div class="d-grid">

                <button class="btn btn-primary btn-block mb-4 d-flex justify-content-center align-items-center">Sign
                    In</button>

            </div>


            <d class="text-center ">
                <p>Not a member? <a href="#!">Register</a></p>
                <p>or sign up with:</p>


                <a href=""><i class="fa-brands fa-facebook text-bg-info"></i></a>
                <a href=""><i class="fa-brands fa-google-plus-g"></i></a>
                <a href=""><i class="fa-brands fa-linkedin"></i></a>




    </div>





    </form>




    </div>




</body>

</html>
